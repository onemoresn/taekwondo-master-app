<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taekwondo Gamified App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .xp-bar {
      transition: width 0.4s;
    }
    .belt {
      font-weight: bold;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      color: white;
      margin-right: 0.5rem;
    }
    .belt-white { background: #e5e7eb; color: #222; border: 1px solid #bbb; }
    .belt-yellow { background: #fde047; color: #b59b00; }
    .belt-green { background: #22c55e; }
    .belt-blue { background: #3b82f6; }
    .belt-red { background: #ef4444; }
    .belt-black { background: #222; }

    /* Glass and hero visuals */
    .glass { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(10px); }
    .hero-bg { position: relative; overflow: hidden; }
    .hero-bg::before, .hero-bg::after {
      content: ""; position: absolute; inset: -20%; border-radius: 50%; filter: blur(50px); opacity: 0.5; pointer-events: none;
    }
    .hero-bg::before { background: radial-gradient(circle at 30% 40%, var(--glow1, rgba(99,102,241,0.4)), transparent 50%); }
    .hero-bg::after { background: radial-gradient(circle at 75% 30%, var(--glow2, rgba(56,189,248,0.4)), transparent 55%); }
    .tab-btn { color: #94a3b8; font-weight: 600; }
    .tab-btn.active { color: #e2e8f0; }

    /* Thin scrollbar styling (applied conditionally) */
    .thin-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .thin-scroll::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.5); border-radius: 8px; }
    .thin-scroll::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-[380px] max-w-full rounded-[28px] overflow-hidden shadow-2xl border border-white/10 bg-gradient-to-b from-slate-950 via-slate-900 to-slate-800">
      <!-- Top chips row -->
      <div class="px-5 pt-4 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="glass rounded-full px-3 py-1 text-sm flex items-center gap-1">
            <span>🪙</span><span>$</span><span>563</span>
          </div>
          <div class="glass rounded-full px-3 py-1 text-sm flex items-center gap-1">
            <span>💎</span><span>1,205</span>
          </div>
        </div>
        <div class="glass rounded-full px-2 py-1 text-xs flex items-center gap-2">
          <div class="w-6 h-6 rounded-full bg-emerald-400 grid place-items-center text-slate-900 font-bold">U</div>
          <span class="bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full">online</span>
        </div>
      </div>

      <!-- Hero section -->
      <div id="heroBg" class="hero-bg relative mt-3 mx-4 rounded-2xl p-4 border border-white/10 bg-white/5 overflow-hidden">
        <div class="absolute inset-0"></div>
        <div class="relative z-10 flex items-center justify-between">
          <div>
            <h1 class="text-xl font-bold">🥋 Taekwondo Quest</h1>
            <div class="mt-2 flex items-center gap-2">
              <div id="beltDisplay" class="belt belt-white">White Belt</div>
            </div>
          </div>
          <img src="tkBoy4.png" alt="Character" class="w-32 h-32 object-fit rounded-xl shadow-2xl ring-2 ring-white/20">
        </div>
        <!-- XP Row -->
        <div class="relative z-10 mt-4">
          <div class="flex items-center gap-4 text-slate-200">
            <div class="font-semibold">Lvl <span id="level">1</span></div>
            <div class="text-sm">XP <span id="xp">0</span>/<span id="xpMax">100</span></div>
          </div>
          <div class="w-full bg-white/10 rounded-full h-2 mt-2">
            <div id="xpBar" class="xp-bar bg-cyan-400 h-2 rounded-full" style="width:0%"></div>
          </div>
        </div>

        <!-- Stat cards mimic -->
        <div class="relative z-10 mt-4 grid grid-cols-3 gap-2">
          <div class="glass rounded-xl p-3 text-center text-sm">
            <div class="text-slate-300">Forms</div>
            <div class="text-cyan-300 font-bold">Beginner</div>
          </div>
          <div class="glass rounded-xl p-3 text-center text-sm">
            <div class="text-slate-300">Sparring</div>
            <div class="text-fuchsia-300 font-bold">Starter</div>
          </div>
          <div class="glass rounded-xl p-3 text-center text-sm">
            <div class="text-slate-300">Defense</div>
            <div class="text-amber-300 font-bold">Novice</div>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="px-5 mt-5">
        <div class="flex items-center gap-6">
          <button class="tab-btn active" data-tab="lessons">Lessons</button>
          <button class="tab-btn" data-tab="dailies">Dailies</button>
          <button class="tab-btn" data-tab="exercises">Exercises</button>
          <button class="tab-btn hidden" data-tab="terms">Terms</button>
        </div>
        <div class="h-1 bg-white/10 rounded mt-2 relative">
          <div id="tabIndicator" class="absolute left-0 top-0 h-1 bg-cyan-400 rounded transition-all" style="width:33.333%"></div>
        </div>
      </div>

      <!-- Lists -->
      <div class="px-5 py-4 space-y-5 text-black">
        <ul id="lessonList" class="space-y-2"></ul>
        <ul id="dailiesList" class="space-y-2 hidden"></ul>
        <ul id="exercisesList" class="space-y-2 hidden"></ul>
        <ul id="termsList" class="space-y-2 hidden"></ul>
      </div>

      <!-- Belt select control -->
      <div class="px-5 pb-5">
        <label for="beltSelect" class="block text-sm text-slate-300 mb-2">Select Your Belt</label>
        <select id="beltSelect" class="w-full bg-white/5 border border-white/10 rounded-lg p-2 text-black">
          <option value="white">White</option>
          <option value="yellow">Yellow</option>
          <option value="yellowGreen">Yellow Belt Green Stripe</option>
          <option value="green">Green</option>
          <option value="greenBlue">Green Belt Blue Stripe</option>
          <option value="blue">Blue</option>
          <option value="blueBrown">Blue Belt Brown Stripe</option>
          <option value="brown">Brown Belt</option>
          <option value="brownRed">Brown Belt Red Stripe</option>
          <option value="red">Red</option>
          <option value="redOne">Red Belt One Stripe</option>
          <option value="redTwo">Red Belt Two Stripes</option>
          <option value="black">Black</option>
        </select>
      </div>

      <!-- Bottom navigation -->
      <div class="bg-black/30 backdrop-blur border-t border-white/10 px-6 py-3 flex justify-between text-slate-300">
        <button class="flex flex-col items-center text-xs">
          <span>📊</span><span>Stats</span>
        </button>
        <button class="flex flex-col items-center text-xs text-cyan-300">
          <span>🏠</span><span>Main</span>
        </button>
        <button class="flex flex-col items-center text-xs">
          <span>🏆</span><span>Events</span>
        </button>
        <button class="flex flex-col items-center text-xs">
          <span>👥</span><span>Friends</span>
        </button>
      </div>
    </div>
  </div>
  <script>
    // Belt data
    const beltData = {
      white: {
        name: 'White Belt',
        class: 'belt-white',
        lessons: [
          'Introduction to Taekwondo',
          'Basic Stances',
          'Respect & Etiquette',
        ],
        dailies: [
          '10x Bow Practice',
          '5 min Meditation',
        ],
        exercises: [
          '10x Front Kicks',
          '10x Punches',
        ],
        terms: [
          'Counting 1-10: Hana, Dul, Set, Net, Dasot, Yoseot, Ilgop, Yodol, Ahop, Yeol',
        ]
      },
      yellow: {
        name: 'Yellow Belt',
        class: 'belt-yellow',
        lessons: [
          'Yellow tip: Learn Kibon Hana',
          'Red tip: Front snap kick, Roundhouse kick, Side kick',
          'Green tip: Execution of all three one-step sparring',
          'Black tip: Learn all testing requirements for yellow belt',
          'Korean Terms: Learn Korean terms',
        ],
        dailies: [
          '15x Bow Practice',
          '10 min Stretching',
        ],
        exercises: [
          '20x Front Kicks',
          '20x Punches',
          '10x Low Blocks',
        ],
        terms: [
          'Counting: Hana(1), Dul(2), Set(3), Net(4), Dasot(5), Yoseot(6), Ilgop(7), Yodol(8), Ahop(9), Yeol(10)',
          'Charyot = Attention',
          'Kyung-neh = Bow',
          'Kukgi-e Kyung-neh = Bow to the flags',
          'Sabomnim-ke Kyung-neh = Bow to the Master',
          'Sunbaenim-ke Kyung-neh = Bow to senior belts',
          'Ap Chagi = Front Kick (Ap Cha gi)',
          'Dollyo Chagi = Roundhouse Kick (Dol yo Cha gi)',
          'Yop Chagi = Side Kick (Yop Cha gi)',
          'Gomabseumnida = Thank you (Go mab seup nee da)'
        ]
      },
      yellowGreen: {
        name: 'Yellow Belt Green Stripe',
        class: 'belt-yellow',
        lessons: [
          'Dan-Gun Pattern',
          'Combination Blocks',
        ],
        dailies: [
          '18x Bow Practice',
          '12 min Stretching',
        ],
        exercises: [
          '25x Front Kicks',
          '15x Low Blocks',
        ]
      },
      green: {
        name: 'Green Belt',
        class: 'belt-green',
        lessons: [
          'Do-San Pattern',
          'Intermediate Kicks',
        ],
        dailies: [
          '20x Bow Practice',
          '15 min Cardio',
        ],
        exercises: [
          '30x Front Kicks',
          '20x Side Kicks',
          '20x High Blocks',
        ]
      },
      greenBlue: {
        name: 'Green Belt Blue Stripe',
        class: 'belt-green',
        lessons: [
          'Won-Hyo Pattern',
          'Turning Kicks',
        ],
        dailies: [
          '22x Bow Practice',
          '16 min Cardio',
        ],
        exercises: [
          '35x Front Kicks',
          '25x Side Kicks',
        ],
        terms: []
      },
      blue: {
        name: 'Blue Belt',
        class: 'belt-blue',
        lessons: [
          'Yul-Gok Pattern',
          'Advanced Kicks',
        ],
        dailies: [
          '25x Bow Practice',
          '20 min Cardio',
        ],
        exercises: [
          '40x Front Kicks',
          '30x Side Kicks',
          '30x High Blocks',
        ],
        terms: []
      },
      blueBrown: {
        name: 'Blue Belt Brown Stripe',
        class: 'belt-blue',
        lessons: [
          'Joong-Gun Pattern',
          'Jumping Kicks',
        ],
        dailies: [
          '28x Bow Practice',
          '22 min Cardio',
        ],
        exercises: [
          '45x Front Kicks',
          '35x Side Kicks',
        ]
      },
      brown: {
        name: 'Brown Belt',
        class: 'belt-red',
        lessons: [
          'Toi-Gye Pattern',
          'Sparring Drills',
        ],
        dailies: [
          '30x Bow Practice',
          '25 min Cardio',
        ],
        exercises: [
          '50x Front Kicks',
          '40x Side Kicks',
        ]
      },
      brownRed: {
        name: 'Brown Belt Red Stripe',
        class: 'belt-red',
        lessons: [
          'Hwa-Rang Pattern',
          'Advanced Sparring',
        ],
        dailies: [
          '32x Bow Practice',
          '27 min Cardio',
        ],
        exercises: [
          '55x Front Kicks',
          '45x Side Kicks',
        ]
      },
      red: {
        name: 'Red Belt',
        class: 'belt-red',
        lessons: [
          'Chung-Mu Pattern',
          'Sparring Drills',
        ],
        dailies: [
          '35x Bow Practice',
          '28 min Cardio',
        ],
        exercises: [
          '60x Front Kicks',
          '50x Side Kicks',
        ]
      },
      redOne: {
        name: 'Red Belt One Stripe',
        class: 'belt-red',
        lessons: [
          'Pattern Review',
          'Board Breaking',
        ],
        dailies: [
          '38x Bow Practice',
          '29 min Cardio',
        ],
        exercises: [
          '65x Front Kicks',
          '55x Side Kicks',
        ]
      },
      redTwo: {
        name: 'Red Belt Two Stripes',
        class: 'belt-red',
        lessons: [
          'Pre-Black Belt Review',
          'Advanced Board Breaking',
        ],
        dailies: [
          '40x Bow Practice',
          '30 min Cardio',
        ],
        exercises: [
          '70x Front Kicks',
          '60x Side Kicks',
        ]
      },
      black: {
        name: 'Black Belt',
        class: 'belt-black',
        lessons: [
          'Choong-Moo Pattern',
          'Leadership Training',
        ],
        dailies: [
          '45x Bow Practice',
          '35 min Cardio',
        ],
        exercises: [
          '80x Front Kicks',
          '70x Side Kicks',
        ]
      }
    };

    // XP/Level system
    let xp = 0;
    let level = 1;
    let xpMax = 100;
    let currentBelt = 'white';
  let activeTab = 'lessons';

    function updateXP(amount) {
      xp += amount;
      while (xp >= xpMax) {
        xp -= xpMax;
        level++;
        xpMax = Math.floor(xpMax * 1.2);
        showLevelUp();
      }
      document.getElementById('xp').textContent = xp;
      document.getElementById('xpMax').textContent = xpMax;
      document.getElementById('level').textContent = level;
      document.getElementById('xpBar').style.width = (xp / xpMax * 100) + '%';
    }

    function showLevelUp() {
      const el = document.createElement('div');
      el.textContent = 'Level Up!';
      el.className = 'fixed top-8 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-xl shadow-lg text-2xl z-50 animate-bounce';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1800);
    }

    function renderSection(listId, items, type) {
      const ul = document.getElementById(listId);
      ul.innerHTML = '';
      items.forEach((item, idx) => {
        const li = document.createElement('li');
        if (type === 'terms') {
          li.className = 'bg-white/10 rounded-lg border border-white/10 p-3 text-slate-200';
          li.textContent = item;
        } else {
          li.className = 'flex items-center bg-white/10 rounded-lg border border-white/10 p-3 justify-between';
          li.innerHTML = `<span class="text-slate-200">${item}</span><button class="ml-4 px-3 py-1 bg-cyan-500 text-slate-900 rounded hover:bg-cyan-400" data-type="${type}" data-idx="${idx}">Complete</button>`;
        }
        ul.appendChild(li);
      });

      // When more than 2 items, constrain height to two rows and enable scroll
      if (items.length > 2) {
        // Allow layout to compute heights then measure first two list items
        const lis = Array.from(ul.children);
        let maxH = 0;
        for (let i = 0; i < Math.min(2, lis.length); i++) {
          maxH += lis[i].getBoundingClientRect().height;
        }
        if (lis.length >= 2) maxH += 8; // accounts for Tailwind space-y-2 (0.5rem)
        ul.style.maxHeight = maxH + 'px';
        ul.style.overflowY = 'auto';
        ul.classList.add('thin-scroll', 'pr-1');
      } else {
        ul.style.maxHeight = '';
        ul.style.overflowY = '';
        ul.classList.remove('thin-scroll', 'pr-1');
      }
    }

    function updateBelt(belt) {
      currentBelt = belt;
      const beltInfo = beltData[belt];
      const beltDisplay = document.getElementById('beltDisplay');
      beltDisplay.textContent = beltInfo.name;
      beltDisplay.className = 'belt ' + beltInfo.class;
      renderSection('lessonList', beltInfo.lessons, 'lesson');
      renderSection('dailiesList', beltInfo.dailies, 'daily');
      renderSection('exercisesList', beltInfo.exercises, 'exercise');
      renderSection('termsList', beltInfo.terms || [], 'terms');

      // Theme hero background glow accents by belt color
      const hero = document.getElementById('heroBg');
      const palette = {
        white: ['rgba(148,163,184,0.5)','rgba(203,213,225,0.5)'],
        yellow: ['rgba(252,211,77,0.5)','rgba(251,191,36,0.5)'],
        yellowGreen: ['rgba(252,211,77,0.5)','rgba(34,197,94,0.5)'],
        green: ['rgba(34,197,94,0.5)','rgba(16,185,129,0.5)'],
        greenBlue: ['rgba(34,197,94,0.5)','rgba(59,130,246,0.5)'],
        blue: ['rgba(59,130,246,0.5)','rgba(56,189,248,0.5)'],
        blueBrown: ['rgba(59,130,246,0.5)','rgba(120,72,36,0.5)'],
        brown: ['rgba(120,72,36,0.6)','rgba(245,158,11,0.4)'],
        brownRed: ['rgba(120,72,36,0.6)','rgba(239,68,68,0.5)'],
        red: ['rgba(239,68,68,0.5)','rgba(245,158,11,0.5)'],
        redOne: ['rgba(239,68,68,0.5)','rgba(244,63,94,0.5)'],
        redTwo: ['rgba(239,68,68,0.6)','rgba(190,24,93,0.5)'],
        black: ['rgba(99,102,241,0.5)','rgba(56,189,248,0.5)'],
      };
      const [g1,g2] = palette[belt] || palette.white;
      hero.style.setProperty('--glow1', g1);
      hero.style.setProperty('--glow2', g2);

      // Show/hide Terms tab for belts White→Blue
      const termsTab = document.querySelector('.tab-btn[data-tab="terms"]');
      const showTerms = ['white','yellow','yellowGreen','green','greenBlue','blue'].includes(belt);
      termsTab.classList.toggle('hidden', !showTerms);
      updateTabIndicatorWidth();

      // After rerender, reapply scroll cap to current tab
      setTimeout(() => {
        if (activeTab && lists[activeTab]) applyScrollCap(lists[activeTab]);
      });
    }

    document.getElementById('beltSelect').addEventListener('change', (e) => {
      updateBelt(e.target.value);
    });

    document.addEventListener('click', function(e) {
      if (e.target.tagName === 'BUTTON' && e.target.dataset.type) {
        updateXP(20);
        e.target.disabled = true;
        e.target.textContent = 'Done!';
        e.target.classList.remove('bg-blue-500', 'hover:bg-blue-700');
        e.target.classList.add('bg-green-500');
      }
    });

    // Tab controls
    const tabs = Array.from(document.querySelectorAll('.tab-btn'));
    const lists = {
      lessons: document.getElementById('lessonList'),
      dailies: document.getElementById('dailiesList'),
      exercises: document.getElementById('exercisesList'),
      terms: document.getElementById('termsList')
    };
    const indicator = document.getElementById('tabIndicator');
    function visibleTabs() { return tabs.filter(t => !t.classList.contains('hidden')); }
    function updateTabIndicatorWidth() {
      const vis = visibleTabs();
      const w = 100 / vis.length;
      indicator.style.width = w + '%';
      const idx = vis.findIndex(b => b.dataset.tab === activeTab);
      indicator.style.left = `${(idx >= 0 ? idx : 0) * w}%`;
    }
    function applyScrollCap(ul) {
      if (!ul) return;
      // Measure two items when visible
      const wasHidden = ul.classList.contains('hidden');
      if (wasHidden) ul.classList.remove('hidden');
      requestAnimationFrame(() => {
        const lis = Array.from(ul.children);
        if (lis.length > 2) {
          let maxH = 0;
          for (let i = 0; i < 2; i++) maxH += lis[i].getBoundingClientRect().height;
          maxH += 8; // gap between rows (space-y-2)
          ul.style.maxHeight = maxH + 'px';
          ul.style.overflowY = 'auto';
          ul.classList.add('thin-scroll','pr-1');
        } else {
          ul.style.maxHeight = '';
          ul.style.overflowY = '';
          ul.classList.remove('thin-scroll','pr-1');
        }
        if (wasHidden) ul.classList.add('hidden');
      });
    }
    function setTab(name) {
      const vis = visibleTabs();
      vis.forEach((b,i) => {
        const active = b.dataset.tab === name;
        b.classList.toggle('active', active);
        if (active) indicator.style.left = `${i * (100/vis.length)}%`;
      });
      Object.keys(lists).forEach(k => lists[k].classList.add('hidden'));
      if (lists[name]) lists[name].classList.remove('hidden');
      activeTab = name;
      updateTabIndicatorWidth();
      applyScrollCap(lists[name]);
    }
    tabs.forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

    // Initial render
    updateBelt('white');
    updateXP(0);
    setTab('lessons');
  </script>
</body>
</html>
